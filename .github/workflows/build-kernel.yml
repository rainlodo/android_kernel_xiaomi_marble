name: Build & Release GlowR Kernel

# 触发方式：
#   1) 推送 tag（GlowR-*）    -> 构建 + 自动发布 Release
#   2) 手动 workflow_dispatch -> 填了版本号就发布，留空则只构建不发布
on:
  push:
    tags:
      - 'GlowR-*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.10，可省略 GlowR- 前缀）。留空 = 只构建，不发 Release'
        required: false
        default: ''
      notes:
        description: 'Release 说明里额外追加的改动描述（留空则只用 git 提交记录自动生成）'
        required: false
        default: ''

# 默认只读；只有 release 任务需要 contents: write
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 统一算出版本号 / 编译时间戳，build 与 release 都用它
  # ------------------------------------------------------------------
  prepare:
    name: 计算版本号
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      stamp: ${{ steps.v.outputs.stamp }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: 计算 tag / 版本号 / 编译时间（北京时间）
        id: v
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"; PUBLISH=true
          else
            RAW="${{ github.event.inputs.version }}"
            case "$RAW" in
              '')      TAG="";           PUBLISH=false ;;
              GlowR-*) TAG="$RAW";       PUBLISH=true  ;;
              *)       TAG="GlowR-$RAW"; PUBLISH=true  ;;
            esac
          fi
          if [ -n "$TAG" ]; then
            VERSION="${TAG#GlowR-}"
          else
            VERSION="dev-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          STAMP="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "stamp=$STAMP"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 构建计划"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`$VERSION\` |"
            echo "| tag | \`${TAG:-（无，仅构建）}\` |"
            echo "| 编译时间（北京时间） | \`$STAMP\` |"
            echo "| 发布 Release | $PUBLISH |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-kernel:
    name: build (docker)
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev zip cpio

      # clang toolchain 是写死版本号的固定产物，没必要每次重新下 ~1GB。
      # 缓存 key 里带版本号：将来换 clang 版本时改 key 就自动失效重建。
      # 注意 actions/cache 的 key 是不可变的（命中后不会更新），所以版本号必须写进来。
      - name: 缓存 Android Clang toolchain (clang-r450784d)
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: toolchain/clang
          key: clang-r450784d-android13-release-v1

      - name: Download Android Clang toolchain (clang-r450784d, Android 13 / 5.10 GKI)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz"
          mkdir -p toolchain/clang
          tar -xf clang.tar.gz -C toolchain/clang

      # PATH 要通过 $GITHUB_PATH 传给后续步骤，所以必须单独一步。
      # 顺便用绝对路径验一下缓存/解包出来的工具链是完整的（缓存损坏时能在这里炸）。
      - name: 把 clang 加进 PATH
        run: |
          echo "$PWD/toolchain/clang/bin" >> $GITHUB_PATH
          ./toolchain/clang/bin/clang --version | head -1

      - name: Configure kernel (marble_gki_defconfig = 唯一配置来源，Docker 选项已内建)
        run: |
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 marble_gki_defconfig
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 olddefconfig

      - name: 注入 GlowR 版本串（版本号 + 编译时间）
        run: scripts/glowr-version.sh out "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.stamp }}"

      - name: 检查本次生效的关键配置（Docker 必需项断言）
        run: |
          grep -E '^#? ?CONFIG_(LOCALVERSION|MODVERSIONS|MODULES|LTO_CLANG|CFI_CLANG|KASAN|SHADOW_CALL_STACK|STACKPROTECTOR|TRIM_UNUSED_KSYMS|NAMESPACES|USER_NS|PID_NS|IPC_NS|SYSVIPC|POSIX_MQUEUE|CGROUP_DEVICE|CGROUP_BPF|KEYS|SECCOMP|TMPFS_XATTR|OVERLAY_FS)' out/.config || true
          # defconfig 是唯一配置来源：这里断言 Docker 必需项没有被 Kconfig 依赖静默回滚
          fail=0
          for o in POSIX_MQUEUE USER_NS CGROUP_DEVICE CGROUP_BPF SECCOMP KEYS \
                   OVERLAY_FS_INDEX OVERLAY_FS_METACOPY OVERLAY_FS_XINO_AUTO \
                   NAMESPACES NET_NS UTS_NS; do
            grep -q "^CONFIG_$o=y" out/.config || { echo "::error::CONFIG_$o 未生效"; fail=1; }
          done
          # 这三个是 v1.0.1 bootloop / v1.0.5 解锁卡死的嫌疑项，必须保持关闭
          for o in PID_NS IPC_NS SYSVIPC TMPFS_XATTR; do
            grep -q "^# CONFIG_$o is not set" out/.config || { echo "::error::CONFIG_$o 应为关闭"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "Docker 关键配置断言通过"
          exit $fail

      - name: Build kernel Image.gz
        run: make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 -j$(nproc) Image.gz

      - name: Verify build products (vmlinux.symvers 由 link-vmlinux.sh 自动产出)
        run: |
          ls -lh out/arch/arm64/boot/Image.gz out/vmlinux.symvers out/.config
          file out/arch/arm64/boot/Image.gz
          echo "符号表行数: $(wc -l < out/vmlinux.symvers)"

      - name: 记录构建信息（kernelrelease / 编译时间 / 提交）
        run: |
          KREL="$(make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 -s kernelrelease 2>/dev/null || echo '(未知)')"
          {
            echo "variant=docker"
            echo "version=${{ needs.prepare.outputs.version }}"
            echo "kernelrelease=$KREL"
            echo "build_time_cst=${{ needs.prepare.outputs.stamp }}"
            echo "commit=${{ github.sha }}"
          } > build-info.txt
          cat build-info.txt
          echo "- \`docker\` kernelrelease: \`$KREL\`" >> $GITHUB_STEP_SUMMARY

      - name: Package with AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          rm -f *placeholder
          rm -rf .git .github   # 干净打包
          cp ../out/arch/arm64/boot/Image.gz .
          # 配置 anykernel.sh：设备 marble / marblein（Redmi Note 12 Turbo / POCO F5）
          sed -i "s|kernel.string=.*|kernel.string=GlowR Kernel for Redmi Note 12 Turbo (marble) / POCO F5 (marblein)|" anykernel.sh
          sed -i "s|device.name1=.*|device.name1=marble|" anykernel.sh
          sed -i "s|device.name2=.*|device.name2=marblein|" anykernel.sh
          sed -i "s|device.name3=.*|device.name3=|" anykernel.sh
          sed -i "s|device.name4=.*|device.name4=|" anykernel.sh
          sed -i "s|device.name5=.*|device.name5=|" anykernel.sh
          sed -i "s|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|" anykernel.sh
          sed -i "s|IS_SLOT_DEVICE=0|IS_SLOT_DEVICE=1|" anykernel.sh
          # GKI 内核无 dtb 源，AK2 会自动沿用原 boot 分区设备树
          cd ..
          cd AnyKernel3 && zip -r9 ../GlowR-kernel-marble-docker-${{ needs.prepare.outputs.version }}.zip .

      - name: KMI 对账（原厂 ROM 模块 ABI）
        # 已放行 CRC 不匹配模块，ABI 对账只作数据参考、不再当门禁
        continue-on-error: true
        run: |
          set +e
          python3 kmi/check_kmi.py \
            --symvers out/vmlinux.symvers \
            --reference kmi/abi_reference.tsv \
            --label "docker ${{ needs.prepare.outputs.version }} (LTO_CLANG_THIN, clang-r450784d)" \
            --report kmi_report.txt | tee kmi_console.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo ""
            echo "## KMI 对账 — docker"
            echo ""
            echo '```'
            head -40 kmi_report.txt 2>/dev/null || echo "(没有报告)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: GKI ABI 基线校验（Google GKI android/abi_gki_aarch64.xml）
        # 同上：仅作数据参考
        continue-on-error: true
        run: |
          set +e
          python3 kmi/check_gki.py \
            android/abi_gki_aarch64.xml \
            out/vmlinux.symvers \
            "docker ${{ needs.prepare.outputs.version }}" 2>&1 | tee gki_report.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo ""
            echo "## GKI ABI 基线校验 — docker"
            echo ""
            echo '```'
            head -30 gki_report.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      # 产物分两个 artifact 上传：刷机包一个、对账证据一个。
      # 这样在 Actions 页面下载时不会得到一个把 20MB 刷机包和证据混在一起的大压缩包。
      - name: Upload 刷机包（AnyKernel3 zip）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlowR-kernel-marble-docker
          path: GlowR-kernel-marble-*.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Upload ABI 对账证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlowR-abi-evidence-docker
          path: |
            kmi_report.txt
            kmi_console.txt
            gki_report.txt
            build-info.txt
            out/vmlinux.symvers
            out/.config
          retention-days: 30
          # out/.config 是点文件，默认不会被上传，这里显式打开
          include-hidden-files: true
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # 构建成功后自动发布 Release
  #   标题 = GlowR <版本号>
  #   正文 = 本次改动描述（git 提交记录，可再手动追加）
  #   附件 = 刷机包 + ABI 对账证据
  # ------------------------------------------------------------------
  release:
    name: 发布 Release
    needs: [prepare, build-kernel]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # 注意：Release 任务刻意不 clone 内核仓库（仓库历史太大，全量 checkout 要十几分钟），
    # gh 在没有 .git 的工作目录里定位不到仓库，所以必须显式给它 GH_REPO。
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # 注意：这里刻意不 clone 仓库。kernel 仓库历史极大（全量 checkout 要十分钟以上），
      # 改动说明改成直接问 GitHub API，几秒钟就能拿到。
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成 Release 说明
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          STAMP: ${{ needs.prepare.outputs.stamp }}
          EXTRA: ${{ github.event.inputs.notes }}
        run: |
          set -eu
          INFO=artifacts/GlowR-abi-evidence-docker/build-info.txt
          KREL="$(sed -n 's/^kernelrelease=//p' "$INFO" 2>/dev/null || true)"
          [ -n "${KREL:-}" ] || KREL="(未记录)"
          PRETTY_STAMP="$(echo "$STAMP" | sed -E 's/^([0-9]{4})([0-9]{2})([0-9]{2})-([0-9]{2})([0-9]{2})$/\1-\2-\3 \4:\5/')"

          # 改动说明的对比基准 = 上一次发布的 tag（问 API，不 clone 仓库）
          PREV="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
                    --jq "[.[] | select(.tag_name != \"$TAG\")][0].tag_name" 2>/dev/null || true)"
          CHANGES=""
          if [ -n "${PREV:-}" ] && [ "$PREV" != "null" ]; then
            CHANGES="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREV...$TAG" \
                         --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' 2>/dev/null | tail -60 || true)"
          fi
          if [ -z "${CHANGES:-}" ]; then
            PREV=""
            CHANGES="$(gh api "repos/$GITHUB_REPOSITORY/commits?per_page=15" \
                         --jq '.[] | "- " + (.commit.message | split("\n")[0])' 2>/dev/null || true)"
          fi

          {
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 内核版本 | \`$KREL\` |"
            echo "| 发布版本 | \`$VERSION\` |"
            echo "| 编译时间（北京时间） | \`$PRETTY_STAMP\` |"
            echo ""
            echo "## 本次改动"
            echo ""
            if [ -n "${EXTRA:-}" ]; then
              printf '%s\n\n' "$EXTRA"
            fi
            if [ -n "$PREV" ]; then
              echo "自上次发布 \`$PREV\` 以来的改动："
            else
              echo "最近的改动："
            fi
            echo ""
            printf '%s\n' "$CHANGES"
            echo ""
            echo "## 校验结果（构建时自动执行）"
            echo ""
            echo "- 原厂 ROM 模块 ABI 对账（2268 个必需符号 + module_layout）：\`kmi_report-docker.txt\`"
            echo "- Google GKI ABI 基线（\`android/abi_gki_aarch64.xml\`）：\`gki_report-docker.txt\`"
            echo ""
            echo "## 文件说明"
            echo ""
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`GlowR-kernel-marble-docker-$VERSION.zip\` | 唯一产物：额外打开容器所需命名空间；ABI 与原厂不完全一致，靠内核放行 CRC 不匹配模块加载 ROM 的 vendor 模块 |"
            echo "| \`*.symvers\` / \`*.config\` / \`*report*.txt\` / \`kernelrelease-*.txt\` | ABI 对账证据（导出符号表 / 内核配置 / 校验报告 / 版本串） |"
            echo ""
            echo "> 适用机型：Redmi Note 12 Turbo / POCO F5（marble / marblein）。刷入前请自行备份 boot 分区。"
          } > RELEASE_NOTES.md
          echo "=== RELEASE_NOTES.md ==="
          cat RELEASE_NOTES.md

      - name: 创建 / 更新 Release 并上传内核文件
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          rm -rf pub && mkdir -p pub
          # 刷机包在 kernel artifact 里，对账证据在 evidence artifact 里（两个 artifact 分开）
          K="artifacts/GlowR-kernel-marble-docker"
          E="artifacts/GlowR-abi-evidence-docker"
          cp "$K"/*.zip pub/ 2>/dev/null || true
          for f in kmi_report gki_report; do
            [ -f "$E/$f.txt" ] && cp "$E/$f.txt" "pub/$f-docker.txt" || true
          done
          # 注意：上传产物时 out/ 的目录层级会被保留，所以用 find 兜住路径差异
          VS="$(find "$E" -name vmlinux.symvers -print -quit || true)"
          CF="$(find "$E" -name .config -print -quit || true)"
          if [ -n "$VS" ]; then cp "$VS" "pub/vmlinux.symvers-docker"; fi
          if [ -n "$CF" ]; then cp "$CF" "pub/kernel-config-docker.txt"; fi
          KREL="$(sed -n 's/^kernelrelease=//p' "$E/build-info.txt" 2>/dev/null || true)"
          if [ -n "${KREL:-}" ]; then printf '%s\n' "$KREL" > "pub/kernelrelease-docker.txt"; fi
          echo "=== 将上传 ==="
          ls -lh pub

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TARGET="--verify-tag"; else TARGET="--target ${GITHUB_SHA}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "GlowR $VERSION" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" --clobber pub/*
          else
            gh release create "$TAG" --title "GlowR $VERSION" --notes-file RELEASE_NOTES.md $TARGET pub/*
          fi
          URL="$(gh release view "$TAG" --json url -q .url)"
          echo "### 已发布 Release：$URL" >> $GITHUB_STEP_SUMMARY
