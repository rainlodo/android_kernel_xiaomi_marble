name: Build GlowR Kernel

# 只在打 tag（GlowR-*）时构建，与原版一致
on:
  push:
    tags:
      - 'GlowR-*'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stock-abi
            # 主线：defconfig 与原厂 ROM 内核逐行对齐，目标是 ABI 100% 一致
          - variant: docker
            # 对照实验：在原厂配置基础上额外打开容器所需命名空间，
            #           用来量化“为了 docker 到底牺牲多少 ABI 一致性”
    name: build (${{ matrix.variant }})

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev zip cpio

      - name: Download Android Clang toolchain (clang-r450784d, Android 13 / 5.10 GKI)
        run: |
          curl -fL --retry 3 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz"
          mkdir -p toolchain/clang
          tar -xf clang.tar.gz -C toolchain/clang
          echo "$PWD/toolchain/clang/bin" >> $GITHUB_PATH
          clang --version | head -1

      - name: Configure kernel (marble_gki_defconfig = 原厂 ABI 基线)
        run: |
          make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 marble_gki_defconfig
          if [ "${{ matrix.variant }}" = "docker" ]; then
            echo "::group::额外打开容器所需选项（实验组）"
            scripts/config --file out/.config \
              -e SYSVIPC -e POSIX_MQUEUE -e IPC_NS \
              -e USER_NS -e PID_NS \
              -e CGROUP_DEVICE -e TMPFS_XATTR \
              -e OVERLAY_FS_INDEX -e OVERLAY_FS_METACOPY -e OVERLAY_FS_XINO_AUTO
            make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 olddefconfig
            echo "::endgroup::"
          fi
          echo "=== 本次生效的关键配置 ==="
          grep -E '^#? ?CONFIG_(LOCALVERSION|MODVERSIONS|MODULES|LTO_CLANG|CFI_CLANG|KASAN|SHADOW_CALL_STACK|STACKPROTECTOR|TRIM_UNUSED_KSYMS|USER_NS|PID_NS|IPC_NS|SYSVIPC|POSIX_MQUEUE|CGROUP_DEVICE|TMPFS_XATTR|OVERLAY_FS)' out/.config || true

      - name: Build kernel Image.gz
        run: make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 -j$(nproc) Image.gz

      - name: Verify build products (vmlinux.symvers 由 link-vmlinux.sh 自动产出)
        run: |
          ls -lh out/arch/arm64/boot/Image.gz out/vmlinux.symvers out/.config
          file out/arch/arm64/boot/Image.gz
          echo "符号表行数: $(wc -l < out/vmlinux.symvers)"
          echo "kernelrelease: $(make ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 -s kernelrelease 2>/dev/null || echo '(未知)')"

      - name: Package with AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          rm -f *placeholder
          rm -rf .git .github   # 干净打包
          cp ../out/arch/arm64/boot/Image.gz .
          # 配置 anykernel.sh：设备 marble / marblein（Redmi Note 12 Turbo / POCO F5）
          sed -i "s|kernel.string=.*|kernel.string=GlowR Kernel for Redmi Note 12 Turbo (marble) / POCO F5 (marblein)|" anykernel.sh
          sed -i "s|device.name1=.*|device.name1=marble|" anykernel.sh
          sed -i "s|device.name2=.*|device.name2=marblein|" anykernel.sh
          sed -i "s|device.name3=.*|device.name3=|" anykernel.sh
          sed -i "s|device.name4=.*|device.name4=|" anykernel.sh
          sed -i "s|device.name5=.*|device.name5=|" anykernel.sh
          sed -i "s|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|" anykernel.sh
          sed -i "s|IS_SLOT_DEVICE=0|IS_SLOT_DEVICE=1|" anykernel.sh
          # GKI 内核无 dtb 源，AK2 会自动沿用原 boot 分区设备树
          cd ..
          cd AnyKernel3 && zip -r9 ../GlowR-kernel-marble-${{ matrix.variant }}.zip .

      - name: KMI / ABI 对账（决定这个包能不能刷）
        # stock-abi 必须通过（不通过=红）；docker 组是实验组，只作数据参考
        continue-on-error: ${{ matrix.variant == 'docker' }}
        run: |
          set +e
          python3 kmi/check_kmi.py \
            --symvers out/vmlinux.symvers \
            --reference kmi/abi_reference.tsv \
            --label "${{ matrix.variant }} (LTO_CLANG_THIN, clang-r450784d)" \
            --report kmi_report.txt | tee kmi_console.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "## KMI 对账 — ${{ matrix.variant }}"
            echo ""
            echo '```'
            head -40 kmi_report.txt 2>/dev/null || echo "(没有报告)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: Upload kernel zip + ABI 证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlowR-kernel-marble-${{ matrix.variant }}
          path: |
            GlowR-kernel-marble-*.zip
            kmi_report.txt
            kmi_console.txt
            out/vmlinux.symvers
            out/.config
          retention-days: 30
          # out/.config 是点文件，默认不会被上传，这里显式打开
          include-hidden-files: true
          if-no-files-found: warn